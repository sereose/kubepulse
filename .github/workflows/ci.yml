name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1
      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/kubepulse
      - name: Smoke test on fixture
        run: |
          go run ./cmd/kubepulse --load testdata/fixture.json --format json > /tmp/report.json
          go run ./cmd/kubepulse --load testdata/fixture.json --node-monthly-cost 150 --storage-cost-per-gi 0.10 > /tmp/report.md
          head -5 /tmp/report.md
          # The fixture is intentionally bad; the gate must trip.
          if go run ./cmd/kubepulse --load testdata/fixture.json --fail-below 50 >/dev/null 2>&1; then
            echo "expected --fail-below to exit non-zero"; exit 1
          fi
